{
  "name": "术语及简称举报（简体中文）",
  "description": "无需安装程序，举报简称、官方名称、缺失术语及适用规则问题。",
  "title": "[DB report] ",
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "无需安装程序，但需要GitHub账号；举报内容与账号名公开。请勿包含API密钥、个人信息及非公开资料。建议将被收集以供审核，必要时使用AI；提交不会自动修改DB。新增及未发布术语须确认正式实装后再审核。"
      }
    },
    {
      "type": "dropdown",
      "id": "category",
      "attributes": {
        "label": "举报类型",
        "options": [
          "简称及输入别名",
          "社区输出简称",
          "官方名称对应错误",
          "缺失术语",
          "说明或适用规则错误",
          "其他翻译错误"
        ],
        "default": 0
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "term",
      "attributes": {
        "label": "目标术语或原文",
        "description": "请注明需要修正的角色、装备、属性名称或原文。"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "dropdown",
      "id": "source-language",
      "attributes": {
        "label": "原文语言",
        "options": [
          "Unknown / 不明 / 알 수 없음 / 未知",
          "한국어 (ko)",
          "English (en)",
          "日本語 (ja)",
          "简体中文 (zh-CN)",
          "繁體中文 (zh-Hant)",
          "Deutsch (de)",
          "Français (fr)",
          "Español (es)",
          "Português (pt)",
          "Русский (ru)",
          "ไทย (th)",
          "Tiếng Việt (vi)",
          "Bahasa Indonesia (id)"
        ],
        "default": 0
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "dropdown",
      "id": "target-language",
      "attributes": {
        "label": "要修正的语言",
        "options": [
          "한국어 (ko)",
          "English (en)",
          "日本語 (ja)",
          "简体中文 (zh-CN)",
          "繁體中文 (zh-Hant)",
          "Deutsch (de)",
          "Français (fr)",
          "Español (es)",
          "Português (pt)",
          "Русский (ru)",
          "ไทย (th)",
          "Tiếng Việt (vi)",
          "Bahasa Indonesia (id)"
        ],
        "default": 0
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "current",
      "attributes": {
        "label": "当前名称或简称"
      },
      "validations": {
        "required": false
      }
    },
    {
      "type": "textarea",
      "id": "suggestion",
      "attributes": {
        "label": "建议名称或简称"
      },
      "validations": {
        "required": false
      }
    },
    {
      "type": "textarea",
      "id": "explanation",
      "attributes": {
        "label": "问题说明及使用语境",
        "description": "说明错误原因及使用语境，最多1,000字符。"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "reference",
      "attributes": {
        "label": "参考链接或截图",
        "description": "可选公开依据链接或截图，最多2,000字符。"
      },
      "validations": {
        "required": false
      }
    },
    {
      "type": "checkboxes",
      "id": "consent",
      "attributes": {
        "label": "公开举报确认",
        "options": [
          {
            "label": "我已确认举报内容公开、将被收集审核，且可能使用AI辅助审核。",
            "required": true
          }
        ]
      }
    }
  ]
}
