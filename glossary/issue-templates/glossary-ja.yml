{
  "name": "用語・略語の報告（日本語）",
  "description": "アプリなしで略語・正式名・未登録用語・適用ルールを報告します。",
  "title": "[DB report] ",
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "プログラムのインストールは不要です。GitHubアカウントが必要で、報告内容とアカウント名は公開されます。APIキー・個人情報・非公開資料を含めないでください。提案は確認用に収集し、必要に応じAIで検討します。送信だけでDBは変更されません。新規・未公開用語は正式実装確認後に検討します。"
      }
    },
    {
      "type": "dropdown",
      "id": "category",
      "attributes": {
        "label": "報告の種類",
        "options": [
          "略語・入力別名",
          "コミュニティ出力略語",
          "正式名称の対応誤り",
          "未登録の用語",
          "説明・適用ルールの誤り",
          "その他の翻訳誤り"
        ],
        "default": 0
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "term",
      "attributes": {
        "label": "対象用語または原文",
        "description": "対象のキャラクター・装備・能力値・原文を記入してください。"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "dropdown",
      "id": "source-language",
      "attributes": {
        "label": "原文の言語",
        "options": [
          "Unknown / 不明 / 알 수 없음 / 未知",
          "한국어 (ko)",
          "English (en)",
          "日本語 (ja)",
          "简体中文 (zh-CN)",
          "繁體中文 (zh-Hant)",
          "Deutsch (de)",
          "Français (fr)",
          "Español (es)",
          "Português (pt)",
          "Русский (ru)",
          "ไทย (th)",
          "Tiếng Việt (vi)",
          "Bahasa Indonesia (id)"
        ],
        "default": 0
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "dropdown",
      "id": "target-language",
      "attributes": {
        "label": "修正する言語",
        "options": [
          "한국어 (ko)",
          "English (en)",
          "日本語 (ja)",
          "简体中文 (zh-CN)",
          "繁體中文 (zh-Hant)",
          "Deutsch (de)",
          "Français (fr)",
          "Español (es)",
          "Português (pt)",
          "Русский (ru)",
          "ไทย (th)",
          "Tiếng Việt (vi)",
          "Bahasa Indonesia (id)"
        ],
        "default": 0
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "current",
      "attributes": {
        "label": "現在の名称または略語"
      },
      "validations": {
        "required": false
      }
    },
    {
      "type": "textarea",
      "id": "suggestion",
      "attributes": {
        "label": "提案する名称または略語"
      },
      "validations": {
        "required": false
      }
    },
    {
      "type": "textarea",
      "id": "explanation",
      "attributes": {
        "label": "問題の説明と使用文脈",
        "description": "問題の理由と使用文脈を記入してください。最大1,000文字。"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "reference",
      "attributes": {
        "label": "参考リンクまたはスクリーンショット",
        "description": "公開された根拠リンクや画像を添付できます。任意、最大2,000文字。"
      },
      "validations": {
        "required": false
      }
    },
    {
      "type": "checkboxes",
      "id": "consent",
      "attributes": {
        "label": "公開報告の確認",
        "options": [
          {
            "label": "報告が公開され、確認のため収集されAIで検討される場合があることを確認しました。",
            "required": true
          }
        ]
      }
    }
  ]
}
