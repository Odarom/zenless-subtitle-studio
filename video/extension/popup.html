<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>ZZZ 자막 작업실</title><link rel="stylesheet" href="popup.css"><script type="module" src="popup.mjs"></script></head><body><header><span class="logo">Z↗</span><div><strong>자막 작업실</strong><small>ZZZ SUBTITLE STUDIO</small></div><span class="badge">YouTube</span></header><label class="language-picker" for="uiLanguage"><span>화면 언어</span><select id="uiLanguage" data-i18n-skip><option value="ko">한국어</option><option value="en">English</option><option value="ja">日本語</option><option value="zh-CN">简体中文</option></select></label><p id="videoTitle" class="muted">영상을 확인하고 있습니다.</p><button id="openStudio" class="primary">이 영상 번역하기 ↗</button><section><label for="token">PC 연결 코드</label><div class="row"><input id="token" type="password" autocomplete="off" placeholder="작업실 설정에서 복사한 코드"><button id="connect">연결</button></div><p class="hint">PC 프로그램을 실행하고 설정 화면에서 코드를 복사하세요.</p></section><section><label for="job">완료된 자막</label><div class="row"><select id="job"><option value="">PC 연결 후 불러올 수 있습니다.</option></select><button id="refresh" title="완료된 작업 새로 확인">↻</button></div><button id="apply" class="primary">선택한 자막 적용</button><label class="file-button" for="file">SRT / VTT / 프로젝트 JSON 불러오기<input id="file" type="file" accept=".srt,.vtt,.json"></label></section><section><div class="settings-grid"><div><label for="mode">표시 내용</label><select id="mode"><option value="translated">번역</option><option value="bilingual">원문 + 번역</option><option value="source">원문</option></select></div><div><label for="offset">자막 지연 (초)</label><input id="offset" type="number" step="0.1" min="-3600" max="3600" value="0"></div></div><div class="checks"><label><input id="showSpeech" type="checkbox" checked> 음성 자막 표시</label><label><input id="showScreen" type="checkbox" checked> 화면 번역 표시</label><label><input id="maskScreen" type="checkbox" checked> 화면 글자 뒤에 배경 표시</label></div><label for="fontSize">글자 크기</label><input id="fontSize" type="range" min="16" max="48" value="28"><div class="row"><button id="displaySettings">표시 설정 적용</button><button id="hide">자막 숨기기</button></div></section><p id="message" role="status" aria-live="polite"></p><footer>먼저 번역하고, 편하게 감상하세요.</footer></body></html>
